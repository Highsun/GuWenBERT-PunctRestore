[project]
name = "guwenbert-punctrestore-task1"
version = "0.2.0"
description = "Independent task 1 project for GuWenBERT-PunctRestore."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "numpy>=2.0,<3",
    "torch==2.9.1",
    "transformers>=4.57,<5",
    "requests>=2.32,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.uv]
package = false
cache-dir = ".cache/uv"

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
